# SQL directory: project root 'database/' (schema.sql, seed-data.sql) or classpath schema/data
app.sql.directory: ${APP_SQL_DIRECTORY:database}

spring:
  application:
    name: rit-university-erp
  main:
    allow-circular-references: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Admin@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 3
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: RITHikariPool

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true
  flyway:
    enabled: true
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    user: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Admin@123}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Error handling for production
  mvc:
    throw-exception-if-no-handler-found: true
  error:
    include-stacktrace: never
    include-message: always

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# JWT Configuration
app:
  jwt:
    # the secret may come from either JWT_SECRET (used in docker-compose) or
    # APP_JWT_SECRET (referenced by .env.example).  Provide a harmless default
    # for development so the app can start without requiring extra vars.
    secret: ${APP_JWT_SECRET:${JWT_SECRET:}}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  google:
    client-id: ${GOOGLE_AUTH_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# CORS: local dev + Vercel frontend + ngrok tunnel hosts (for deployed frontend + local backend)
app.cors:
  allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://*.ngrok-free.app,https://*.ngrok-free.dev,https://*.ngrok.io}

# Adaptive Defense (military-grade behavioral security)
app.adaptive-defense:
  enabled: true
  baseline-window-minutes: 60
  baseline-min-samples: 20
  risk:
    low-threshold: 25
    medium-threshold: 50
    high-threshold: 75
    critical-threshold: 90
    decay-per-minute: 2
  rate-limit:
    normal-requests-per-minute: 300
    elevated-requests-per-minute: 120
    high-requests-per-minute: 60
    critical-requests-per-minute: 20
    window-seconds: 60
  session:
    max-requests-per-minute-per-session: 120
    rapid-action-window-ms: 2000
    rapid-action-threshold: 15
    revalidate-after-anomaly: true
  data-access:
    list-request-burst-threshold: 30
    list-burst-window-seconds: 60
  cooldown:
    high-risk-minutes: 5
    critical-minutes: 15
  stealth: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      # Tuned for cloud DBs like Aiven in production
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: 5
      idle-timeout: 300000      # 5 minutes
      max-lifetime: 1800000     # 30 minutes (below typical Aiven limit)
      connection-timeout: 30000 # 30 seconds
