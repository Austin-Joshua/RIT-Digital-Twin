spring:
  application:
    name: rit-university-erp

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 3
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: RITHikariPool

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: false

  # Error handling for production
  mvc:
    throw-exception-if-no-handler-found: true
  error:
    include-stacktrace: never
    include-message: always

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# JWT Configuration
app:
  jwt:
    # the secret may come from either JWT_SECRET (used in docker-compose) or
    # APP_JWT_SECRET (referenced by .env.example).  Provide a harmless default
    # for development so the app can start without requiring extra vars.
    secret: ${APP_JWT_SECRET:v9yB2E5H8KcNfUjXn2r5u8xA2D4G7KbPeShVkYp3s6v9y8B0E1H2McQfTjWnZr4}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  google:
    client-id: ${GOOGLE_AUTH_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# CORS: local dev + Vercel frontend + ngrok tunnel hosts (for deployed frontend + local backend)
app.cors:
  allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://*.ngrok-free.app,https://*.ngrok-free.dev,https://*.ngrok.io}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
