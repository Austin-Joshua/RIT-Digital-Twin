# JWT, Google, CORS, and Adaptive Defense Configuration
app:
  sql.directory: ${APP_SQL_DIRECTORY:database}
  external-url: ${RENDER_EXTERNAL_URL:https://rit-backend-0zvm.onrender.com}
  firebase:
    credentials: ${APP_FIREBASE_CREDENTIALS:}
    credentials-file: ${APP_FIREBASE_CREDENTIALS_FILE:}
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:RITDigitalTwinSuperSecretKeyForLocalDevelopmentOnly2024XYZ}}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
  google:
    client-id: ${GOOGLE_AUTH_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://*.up.railway.app,https://*.railway.app,https://*.ngrok-free.app,https://*.ngrok-free.dev,https://*.ngrok.io}
  timetable:
    generator-faculty-username: ${APP_TIMETABLE_GENERATOR_FACULTY_USERNAME:}
  adaptive-defense:
    enabled: true
    baseline-window-minutes: 60
    baseline-min-samples: 20
    risk:
      low-threshold: 25
      medium-threshold: 50
      high-threshold: 75
      critical-threshold: 90
      decay-per-minute: 2
    rate-limit:
      normal-requests-per-minute: 300
      elevated-requests-per-minute: 120
      high-requests-per-minute: 60
      critical-requests-per-minute: 20
      window-seconds: 60
    session:
      max-requests-per-minute-per-session: 120
      rapid-action-window-ms: 2000
      rapid-action-threshold: 15
      revalidate-after-anomaly: true
    data-access:
      list-request-burst-threshold: 30
      list-burst-window-seconds: 60
    cooldown:
      high-risk-minutes: 5
      critical-minutes: 15
    stealth: true

spring:
  application:
    name: rit-university-erp
  main:
    allow-circular-references: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 3
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: RITHikariPool
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  mvc:
    throw-exception-if-no-handler-found: true
  error:
    include-stacktrace: never
    include-message: always

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:50}
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true
