spring:
  config:
    activate:
      on-profile: dev

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

  datasource:
    url: jdbc:mysql://localhost:3306/digital_twin_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

logging:
  level:
    com.digitaltwin: DEBUG
    org.hibernate.SQL: DEBUG
