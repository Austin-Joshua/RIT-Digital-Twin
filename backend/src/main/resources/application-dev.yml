spring:
  config:
    activate:
      on-profile: dev

  # Dev uses Flyway for schema management (consistent with prod)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: false

logging:
  level:
    com.university.erp: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
