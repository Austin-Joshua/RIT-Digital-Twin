spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Tuned for Aiven MySQL (proxied connections)
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: 5
      idle-timeout: 300000      # 5 minutes
      max-lifetime: 1800000     # 30 minutes
      connection-timeout: 30000 # 30 seconds
      connection-test-query: SELECT 1

  # Flyway MUST be enabled in prod to run migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false  # Avoid checksum failures on existing migrations

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    com.university.erp: WARN
    org.springframework: WARN
    org.flywaydb: INFO
