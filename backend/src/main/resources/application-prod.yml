spring:
  config:
    activate:
      on-profile: prod
  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Right-sized for cloud MySQL (Aiven) + Render container:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: 5
      idle-timeout: 60000       # 1 minute
      max-lifetime: 600000      # 10 minutes
      connection-timeout: 20000 # 20 seconds
      pool-name: RIT-DigitalTwin-HikariCP

  # Flyway configuration for prod
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate.generate_statistics: false

logging:
  level:
    com.university.erp: WARN
    org.springframework: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
