spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Institutional scale: 100 concurrent connections for massive traffic
      maximum-pool-size: ${HIKARI_MAX_POOL:100}
      minimum-idle: 10
      idle-timeout: 300000      # 5 minutes
      max-lifetime: 1800000     # 30 minutes
      connection-timeout: 30000 # 30 seconds
      connection-test-query: SELECT 1
      pool-name: RIT-DigitalTwin-HikariCP

  # Flyway MUST be enabled in prod to run migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false  # Avoid checksum failures on existing migrations

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
      hibernate.generate_statistics: false

logging:
  level:
    com.university.erp: WARN
    org.springframework: WARN
    org.flywaydb: INFO
