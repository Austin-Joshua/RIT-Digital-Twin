# ==============================================================
# RIT Digital Twin – Docker Compose
# Scalable deployment: MySQL + Spring Boot + React/Nginx
# Rajalakshmi Institute of Technology, Chennai
# ==============================================================

services:
  # ---- MySQL 8.0 Database ----
  mysql:
    image: mysql:8.0
    container_name: rit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RitDigitalTwin@2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rit_digital_twin}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    networks:
      - rit-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RitDigitalTwin@2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ---- Spring Boot Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rit-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-RitDigitalTwin@2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_JWT_SECRET: ${JWT_SECRET:-RITDigitalTwinSmartCampusIntelligencePlatformSecretKey2026VeryLongSecureKeyForProduction}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rit-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  # ---- React Frontend (Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rit-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rit-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

# ---- Volumes ----
volumes:
  mysql_data:
    driver: local

# ---- Network ----
networks:
  rit-network:
    driver: bridge
