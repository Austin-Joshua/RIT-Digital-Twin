
services:
  # ==========================================
  # Database (MySQL)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: rit-digital-twin-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: rit_digital_twin
      MYSQL_USER: rit_user
      MYSQL_PASSWORD: rit_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rit-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # ==========================================
  # Backend (Spring Boot)
  # ==========================================
  backend:
    build: ./backend
    container_name: rit-digital-twin-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rit_digital_twin?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: rit_user
      SPRING_DATASOURCE_PASSWORD: rit_password
      APPLICATION_SECURITY_JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APPLICATION_SECURITY_JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rit-network

  # ==========================================
  # Frontend (React + Nginx)
  # ==========================================
  frontend:
    build: ./frontend
    container_name: rit-digital-twin-frontend
    ports:
      - "3000:80"
    networks:
      - rit-network

networks:
  rit-network:
    driver: bridge

volumes:
  mysql_data:
