version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    container_name: rit_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rit_db
    volumes:
      - rit_db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: on-failure
    container_name: rit_backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/rit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: rit_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  rit_db_data:
