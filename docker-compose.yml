version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: erp-db
    environment:
      MYSQL_DATABASE: rit_digital_twin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: erp-backend
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/rit_digital_twin?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_JWT_SECRET: RITDigitalTwinSmartCampusIntelligencePlatformSecretKey2026VeryLongSecureKey

  frontend:
    build: ./frontend
    container_name: erp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
