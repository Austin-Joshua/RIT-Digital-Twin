name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping the hook."
            echo "Render still deploys from the GitHub connection on push to main."
            echo "Add the secret only if you want this job to call https://api.render.com/deploy/..."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Vercel auto-deploys on push to main
    runs-on: ubuntu-latest
    steps:
      - run: echo "Vercel automatically deploys on push - nothing to do here."
