name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Vercel auto-deploys on push to main
    runs-on: ubuntu-latest
    steps:
      - run: echo "Vercel automatically deploys on push - nothing to do here."
