name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "Use the deploy hook URL from the Render service (https://api.render.com/deploy/...)."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: Vercel auto-deploys on push to main
    runs-on: ubuntu-latest
    steps:
      - run: echo "Vercel automatically deploys on push - nothing to do here."
