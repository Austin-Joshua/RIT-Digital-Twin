services:
  - type: web
    name: rit-digital-twin-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database settings - Retrieve these from your Aiven MySQL console
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Security Keys
      - key: JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      # CORS for the Vercel Frontend
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Production Overrides
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
