<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/assets/images/digital-twin-tree.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description"
    content="RIT Digital Twin - Smart Campus Intelligence Platform for Rajalakshmi Institute of Technology, Chennai" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <title>RIT Digital Twin | Smart Campus Intelligence Platform</title>
  <script>
    try {
      var preference = localStorage.getItem('theme-preference') || 'system';
      var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <style>
    html, body { margin: 0; background: #F8FAFC; color: #0F172A; }
    html.dark, html.dark body { background: #020617; color: #F8FAFC; }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 10000;
      min-height: 100vh;
      display: flex;
      background: #F8FAFC;
    }
    html.dark #boot { background: #020617; }
    #boot .boot-brand {
      width: 50%;
      background: linear-gradient(135deg, #0B2C6B 0%, #123C8C 100%);
    }
    @media (max-width: 1024px) {
      #boot { display: block; }
      #boot .boot-brand { width: 100%; height: 120px; }
    }
  </style>
</head>

<body>
  <div id="boot" aria-hidden="true"><div class="boot-brand"></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
